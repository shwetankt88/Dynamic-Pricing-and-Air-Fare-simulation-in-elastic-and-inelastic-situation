<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #020617; color: white; }</style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold">{{s}} to {{d}} Analysis</h1>
            <a href="/" class="bg-slate-800 px-4 py-2 rounded-lg text-sm border border-slate-700">New Simulation</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- Revenue -->
            <div class="bg-orange-500/10 border border-orange-500/20 p-6 rounded-3xl">
                <p class="text-orange-500 text-xs font-bold uppercase">Elastic Revenue</p>
                <p class="text-3xl font-extrabold mt-1">₹{{results.total_rev_el}}</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-6 rounded-3xl">
                <p class="text-emerald-500 text-xs font-bold uppercase">Inelastic Revenue</p>
                <p class="text-3xl font-extrabold mt-1">₹{{results.total_rev_in}}</p>
            </div>
            <!-- Max Prices -->
            <div class="bg-indigo-500/10 border border-indigo-500/20 p-6 rounded-3xl">
                <p class="text-indigo-400 text-xs font-bold uppercase">Peak Fare (Elastic)</p>
                <p class="text-3xl font-extrabold mt-1">₹{{results.max_price_el}}</p>
            </div>
            <div class="bg-blue-500/10 border border-blue-500/20 p-6 rounded-3xl">
                <p class="text-blue-400 text-xs font-bold uppercase">Peak Fare (Inelastic)</p>
                <p class="text-3xl font-extrabold mt-1">₹{{results.max_price_in}}</p>
            </div>
        </div>

        <div class="bg-slate-900 p-2 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
            <img src="{{ url_for('static', filename='results/output.png') }}?v={{range(1, 999)|random}}" class="w-full">
        </div>
    </div>
</body>
</html>
