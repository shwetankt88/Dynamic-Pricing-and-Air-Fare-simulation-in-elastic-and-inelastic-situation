<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simulation Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #0f172a; color: white; }</style>
</head>
<body class="p-10">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Analysis: {{source}} → {{dest}}</h1>
            <a href="/" class="text-indigo-400 hover:underline">← Back to Inputs</a>
        </div>

        <!-- Revenue Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="bg-orange-500/10 border border-orange-500/30 p-6 rounded-2xl">
                <p class="text-orange-400 text-sm font-bold uppercase">Elastic Condition</p>
                <h2 class="text-4xl font-bold mt-2">₹{{results.total_rev_el}}</h2>
                <p class="text-slate-400 text-xs mt-1">Total Estimated Revenue</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/30 p-6 rounded-2xl">
                <p class="text-emerald-400 text-sm font-bold uppercase">Inelastic Condition</p>
                <h2 class="text-4xl font-bold mt-2">₹{{results.total_rev_in}}</h2>
                <p class="text-slate-400 text-xs mt-1">Total Estimated Revenue</p>
            </div>
        </div>

        <!-- Plot Display -->
        <div class="bg-white p-4 rounded-2xl shadow-2xl overflow-hidden">
            <img src="{{ url_for('static', filename='results/output.png') }}?v={{range(1, 999)|random}}"
                 alt="Simulation Results" class="w-full rounded-lg">
        </div>
    </div>
</body>
</html>
