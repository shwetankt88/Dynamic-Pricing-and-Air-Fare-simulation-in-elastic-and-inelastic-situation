<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AirFare Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }</style>
</head>
<body class="p-10">
    <div class="max-w-4xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold mb-6 text-indigo-400">Dynamic Airfare Simulation</h1>

        <form action="/simulate" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Select Dataset -->
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Dataset</label>
                    <select name="file_name" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3">
                        {% for file in files %}<option value="{{file}}">{{file}}</option>{% endfor %}
                    </select>
                </div>

                <!-- Route Selection -->
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Source</label>
                    <select name="source" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3">
                        {% for s in sources %}<option value="{{s}}">{{s}}</option>{% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Destination</label>
                    <select name="destination" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3">
                        {% for d in destinations %}<option value="{{d}}">{{d}}</option>{% endfor %}
                    </select>
                </div>
            </div>

            <!-- Elasticity Sliders -->
            <div class="p-4 bg-slate-900 rounded-xl">
                <h3 class="font-semibold mb-4 text-indigo-300">Elasticity Parameters</h3>
                <div class="space-y-4">
                    <div>
                        <label class="flex justify-between text-sm">Elastic Condition: <span id="e_val">-1.5</span></label>
                        <input type="range" name="elastic_val" min="-5" max="0" step="0.1" value="-1.5"
                               oninput="document.getElementById('e_val').innerText = this.value"
                               class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500">
                    </div>
                    <div>
                        <label class="flex justify-between text-sm">Inelastic Condition: <span id="i_val">-0.5</span></label>
                        <input type="range" name="inelastic_val" min="-1" max="0" step="0.1" value="-0.5"
                               oninput="document.getElementById('i_val').innerText = this.value"
                               class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/20">
                Run Simulation
            </button>
        </form>
    </div>
</body>
</html>
